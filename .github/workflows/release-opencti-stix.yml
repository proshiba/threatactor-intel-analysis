name: Package and release OpenCTI STIX

on:
  push:
    tags:
      - "opencti-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencti-stix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run actor profile unit tests
        run: python3 -m unittest discover -s actor_profile/tests -v

      - name: Run daily ingestion unit tests
        run: python3 -m unittest discover -s parse-daily/tests -v

      - name: Rebuild OpenCTI bundles
        run: python3 actor_profile/scripts/build_opencti_bundles.py --prune

      - name: Verify the committed OpenCTI distribution is current
        shell: bash
        run: |
          set -euo pipefail
          status_file="$(mktemp)"
          git status --porcelain --untracked-files=all -- opencti > "$status_file"
          if [[ -s "$status_file" ]]; then
            cat "$status_file"
            git diff -- opencti
            exit 1
          fi

      - name: Build reproducible release assets
        run: >-
          python3 actor_profile/scripts/package_opencti_release.py
          --output-dir dist/opencti-release

      - name: Verify release checksums
        working-directory: dist/opencti-release
        run: sha256sum -c SHA256SUMS

      - name: Upload validated package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencti-stix-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/opencti-release/opencti-stix-all.tar.gz
            dist/opencti-release/opencti-stix-all.zip
            dist/opencti-release/opencti-stix-actors.tar.gz
            dist/opencti-release/opencti-stix-campaigns.tar.gz
            dist/opencti-release/opencti-stix-activities.tar.gz
            dist/opencti-release/opencti-manifest.json
            dist/opencti-release/SHA256SUMS

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/opencti-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: opencti-stix-${{ github.sha }}
          path: release-assets

      - name: Verify downloaded release checksums
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS

      - name: Validate release tag and main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^opencti-v([0-9]{4}\.[0-9]{2}\.[0-9]{2})(-[0-9]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          release_date="${BASH_REMATCH[1]}"
          if ! parsed_date="$(
            date -u -d "${release_date//./-}" +%Y.%m.%d 2>/dev/null
          )" || [[ "$parsed_date" != "$release_date" ]]; then
            echo "Release tag has an invalid calendar date: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_ref="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.type + " " + .object.sha'
          )"
          read -r tag_type tag_sha <<< "$tag_ref"
          if [[ "$tag_type" != "commit" || "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Release requires an unmoved lightweight tag at $GITHUB_SHA" >&2
            exit 1
          fi
          comparison="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/compare/main...${tag_sha}" \
              --jq '.status'
          )"
          case "$comparison" in
            identical|behind) ;;
            *)
              echo "Tag is not on the main branch: status=$comparison" >&2
              exit 1
              ;;
          esac

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-assets/opencti-stix-all.tar.gz \
            release-assets/opencti-stix-all.zip \
            release-assets/opencti-stix-actors.tar.gz \
            release-assets/opencti-stix-campaigns.tar.gz \
            release-assets/opencti-stix-activities.tar.gz \
            release-assets/opencti-manifest.json \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --fail-on-no-commits \
            --generate-notes \
            --title "OpenCTI STIX ${RELEASE_TAG}"
