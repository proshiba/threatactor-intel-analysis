name: Migrate workbook aliases

on:
  push:
    branches:
      - fix/workbook-alias-boundaries-20260919

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook dependency
        run: python3 -m pip install openpyxl

      - name: Test and migrate aliases
        run: |
          set -euxo pipefail
          python3 -m unittest discover -s actor_profile/tests -v
          python3 actor_profile/scripts/migrate_workbook_aliases.py --apply
          python3 actor_profile/scripts/crosscheck_all_actors.py
          python3 actor_profile/scripts/build_claim_audits.py
          python3 actor_profile/scripts/process_all_profiles.py --workers 3 --skip-ingest
          python3 actor_profile/scripts/render_collection_index.py \
            profiles/processing-summary.json \
            actor_profile/corpus-catalog.json \
            profiles/README.md
          python3 ui/build_data.py
          python3 ui/build_portal_index.py

      - name: Verify workbook alias boundaries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          countries = {
              'afghanistan','albania','argentina','armenia','australia','austria',
              'azerbaijan','bangladesh','belarus','belgium','brazil','canada','china',
              'colombia','ecuador','egypt','estonia','france','georgia','germany',
              'hong kong','india','indonesia','iran','iraq','israel','italy','japan',
              'jordan','kazakhstan','korea','kyrgyzstan','latvia','lebanon','lithuania',
              'malaysia','mexico','mongolia','netherlands','north korea','norway',
              'pakistan','philippines','poland','romania','russia','saudi arabia',
              'singapore','south korea','spain','sri lanka','sweden','switzerland',
              'syria','taiwan','tajikistan','thailand','turkey','ukraine',
              'united arab emirates','united kingdom','united states','uzbekistan',
              'vietnam'
          }
          offenders = []
          composite = []
          prose = []
          for profile_path in Path('profiles').glob('*/actor-profile.json'):
              profile = json.loads(profile_path.read_text(encoding='utf-8'))
              if profile.get('status') == 'deprecated':
                  continue
              for alias in profile.get('actor', {}).get('aliases', []):
                  if not isinstance(alias, dict) or alias.get('vendor') != 'actor-mapping-workbook':
                      continue
                  name = (alias.get('name') or '').strip()
                  if name.casefold() in countries:
                      offenders.append((profile_path.parent.name, name))
                  if any(sep in name for sep in [',', ';', '\n']):
                      composite.append((profile_path.parent.name, name))
                  low = name.casefold()
                  if ('activity aligns' in low or 'state interests' in low
                      or 'offshore apt organization' in low):
                      prose.append((profile_path.parent.name, name))

          assert not offenders, offenders
          assert not composite, composite
          assert not prose, prose

          known = {
              'gravityrat': {'Pakistan'},
              'sidecopy': {'Pakistan'},
              'sidewinder': {'India'},
              'magnetic-spider': {'Russia'},
              'carbanak': {'Ukraine'},
          }
          for slug, forbidden in known.items():
              p = json.loads((Path('profiles') / slug / 'actor-profile.json').read_text(encoding='utf-8'))
              names = {a.get('name') for a in p['actor']['aliases'] if isinstance(a, dict)}
              assert names.isdisjoint(forbidden), (slug, names & forbidden)

          processing = json.loads(Path('profiles/processing-summary.json').read_text(encoding='utf-8'))
          assert processing['actor_count'] == 674
          assert processing['complete_count'] == 674
          assert processing['error_count'] == 0
          print('verified workbook alias boundaries and 674/674 profile validation')
          PY

      - name: Commit migrated outputs
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actor_profile profiles ui
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "[generated] migrate workbook alias boundaries"
          git push origin "HEAD:${GITHUB_REF_NAME}"
